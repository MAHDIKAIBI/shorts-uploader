name: Lord Mahdi Render Pipeline

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight UTC
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  ai_machine:
    name: Vision AI Engine (Machine 1)
    runs-on: ubuntu-latest
    services:
      ollama:
        image: ollama/ollama
        ports:
          - 11434:11434
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: pip install requests google-api-python-client google-auth-httplib2 google-auth-oauthlib pytz g4f

      - name: Retrieve Google Drive Token
        run: |
          cat << 'EOF' > drive_token.json
          ${{ secrets.G_DRIVE_TOKEN }}
          EOF
          python download_assets.py

      - name: Pull Qwen 2.5 Vision Model (Fallback Engine)
        run: |
          echo "Pulling qwen2.5vl:7b into local Ollama service..."
          curl -X POST http://localhost:11434/api/pull -d '{"name": "qwen2.5vl:7b"}'

      - name: Run AI Orchestrator (AI Only)
        env:
          VIDEOS_DIR: ./public/videos
          OUTPUT_DIR: ./rendered_videos
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python orchestrator.py --ai-only
          
      - name: Pass Metadata to Render Machine
        uses: actions/upload-artifact@v4
        with:
          name: ai_metadata
          path: ./rendered_videos/
          if-no-files-found: ignore

  render_machine:
    name: Remotion Video Renderer (Machine 2)
    needs: ai_machine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: pip install requests google-api-python-client google-auth-httplib2 google-auth-oauthlib pytz g4f

      - name: Retrieve Google Drive Token
        run: |
          cat << 'EOF' > drive_token.json
          ${{ secrets.G_DRIVE_TOKEN }}
          EOF
          python download_assets.py

      - name: Download Metadata from AI Machine
        uses: actions/download-artifact@v4
        with:
          name: ai_metadata
          path: ./rendered_videos/

      - name: Install Remotion Dependencies
        run: npm ci

      - name: Run AI Orchestrator (Render Only)
        env:
          VIDEOS_DIR: ./public/videos
          OUTPUT_DIR: ./rendered_videos
        run: |
          python orchestrator.py --render-only

      - name: Upload to YouTube
        env:
          OUTPUT_DIR: ./rendered_videos
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python hydraulic_press_uploader.py

      - name: Save State to Google Drive
        run: |
          python upload_state.py
