name: Lord Mahdi Render Pipeline

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight UTC
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  render_and_upload:
    runs-on: ubuntu-latest
    services:
      ollama:
        image: ollama/ollama
        ports:
          - 11434:11434
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: pip install g4f google-api-python-client google-auth-httplib2 google-auth-oauthlib pytz

      - name: Retrieve Google Drive Token
        run: |
          cat << 'EOF' > drive_token.json
          ${{ secrets.G_DRIVE_TOKEN }}
          EOF
          python download_assets.py

      - name: Install Remotion Dependencies
        run: npm ci

      - name: Debug - List downloaded assets
        run: |
          echo "--- Files in ./public/videos ---"
          ls -la ./public/videos/ 2>/dev/null || echo "EMPTY OR MISSING"
          echo "--- Python files in root ---"
          ls -la *.py 2>/dev/null || echo "No .py files"
          echo "--- orchestrator.py VIDEOS_DIR default ---"
          grep -n "VIDEOS_DIR" orchestrator.py || echo "No VIDEOS_DIR found"

      - name: Pull Qwen 2.5 Vision Model (Fallback Engine)
        run: |
          echo "Pulling qwen2.5vl:7b into local Ollama service..."
          curl -X POST http://localhost:11434/api/pull -d '{"name": "qwen2.5vl:7b"}'

      - name: Run AI Orchestrator (g4f)
        env:
          VIDEOS_DIR: ./public/videos
          OUTPUT_DIR: ./rendered_videos
        run: |
          python orchestrator.py

      - name: Upload to YouTube
        env:
          OUTPUT_DIR: ./rendered_videos
        run: |
          python hydraulic_press_uploader.py

      - name: Save State to Google Drive
        run: |
          python upload_state.py
